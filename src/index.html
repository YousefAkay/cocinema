<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoCinema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="landing-screen">
    <h1>CoCinema</h1>
    <p>Rate a handful of movies you've seen. CoCinema reads the plots of what you loved (and what you didn't), then finds films whose stories match your taste.</p>
    <p id="load-error" role="alert" hidden></p>
    <button id="retry-button" hidden>Retry</button>
    <button id="start-button" disabled>Get started</button>
  </div>

  <div id="rating-screen" style="display: none;">
    <!-- rating grid -->
  </div>

  <div id="results-screen" style="display: none;">
    <!-- recommendations -->
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
