<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoCinema</title>
  <meta name="description" content="A movie recommender that runs in your browser. Rate a few films and get picks that match your taste, with no account and no analytics. Your taste profile is computed on your device.">
  <meta name="theme-color" content="#7c5cff">
  <link rel="canonical" href="https://cocinema-pi.vercel.app/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CoCinema">
  <meta property="og:title" content="CoCinema: movie picks that match your taste">
  <meta property="og:description" content="Rate a few movies and get recommendations. It runs in your browser with no account and no analytics, and your taste profile is computed on your device.">
  <meta property="og:url" content="https://cocinema-pi.vercel.app/">
  <meta property="og:image" content="https://cocinema-pi.vercel.app/src/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CoCinema: rate a few movies, get picks that match your taste.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CoCinema: movie picks that match your taste">
  <meta name="twitter:description" content="Rate a few movies and get recommendations. It runs in your browser with no account and no analytics, and your taste profile is computed on your device.">
  <meta name="twitter:image" content="https://cocinema-pi.vercel.app/src/og-image.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="main">
    <div id="offline-notice" class="offline-notice" role="status" hidden>Offline - using saved data</div>

    <div id="landing-screen">
      <h1 tabindex="-1">CoCinema</h1>
      <p>Rate a handful of movies you've seen. CoCinema reads the plots of what you loved (and what you didn't), then finds films whose stories match your taste.</p>
      <p id="load-error" role="alert" hidden></p>
      <button id="retry-button" hidden>Retry</button>
      <button id="start-button" disabled>Get started</button>
    </div>

    <div id="rating-screen" style="display: none;">
      <!-- rating grid -->
    </div>

    <div id="results-screen" style="display: none;">
      <!-- recommendations -->
    </div>

    <div id="detail-screen" style="display: none;">
      <!-- movie detail page -->
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
